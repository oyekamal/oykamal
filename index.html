<!DOCTYPE html>

    .muted-link { color: var(--bs-secondary-color); text-decoration: none; }

    .section-title { margin-bottom: 1.25rem; }
  </style>

<body data-bs-spy="scroll" data-bs-target="#mainNav" data-bs-smooth-scroll="true" tabindex="0">
  <!-- Navbar (rendered) -->
  <nav id="mainNav" class="navbar navbar-expand-lg bg-body fixed-top border-bottom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#top" id="brand-slot">
        <!-- brand injected -->
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#skills">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="#experience">Experience</a></li>
          <li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>

  <main id="top" class="pt-5">
    <!-- Hero -->

      <div class="container">
        <div class="row align-items-center g-4">
          <div class="col-lg-8">
            <h1 class="display-5 fw-bold" id="hero-title">Backend Engineer</h1>
            <p class="lead text-secondary" id="hero-subtitle">I design scalable APIs & systems.</p>
            <div class="hero-cta" id="hero-cta"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="section">
      <div class="container">
        <h2 class="section-title fw-semibold">About</h2>
        <div class="row g-4 align-items-center">
          <div class="col-md-8">
            <p class="fs-5" id="about-text"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- Skills -->
    <section id="skills" class="section bg-body-tertiary">
      <div class="container">
        <h2 class="section-title fw-semibold">Skills</h2>
        <div id="skills-list" class="d-flex flex-wrap"></div>
      </div>
    </section>

    <!-- Experience -->
    <section id="experience" class="section">
      <div class="container">
        <h2 class="section-title fw-semibold">Experience</h2>
        <div id="experience-list" class="vstack gap-3"></div>

    <!-- Projects -->
    <section id="projects" class="section">

    <!-- Contact -->
    <section id="contact" class="section bg-body-tertiary">
      <div class="container">
        <h2 class="section-title fw-semibold">Contact</h2>

  <!-- Footer -->
  <footer class="footer py-4">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
      <small class="text-secondary" id="copyright"></small>
      <div class="d-flex align-items-center gap-2">
        <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Toggle color mode">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </footer>

  <!-- Mustache templates -->
  <script id="tpl-skill" type="x-tmpl-mustache">
    <span class="badge rounded-pill badge-soft me-2 mb-2">
      {{#icon}}<i class="{{icon}} me-1"></i>{{/icon}}{{name}}
    </span>
  </script>

  <script id="tpl-project" type="x-tmpl-mustache">
    <div class="col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm">
        {{#image}}
        <img src="{{image}}" class="card-img-top" alt="{{title}}">
        {{/image}}
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{title}}</h5>
          <p class="card-text flex-grow-1">{{description}}</p>
          {{#stack.length}}
          <div class="stack mb-3">
            {{#stack}}
            <span class="badge rounded-pill badge-soft">{{.}}</span>
            {{/stack}}
          </div>
          {{/stack.length}}
          <div class="d-flex gap-2">
            {{#links.github}}
            <a class="btn btn-outline-secondary btn-sm icon-btn" href="{{links.github}}" target="_blank" rel="noreferrer">
              <i class="fa-brands fa-github"></i> Code
            </a>
            {{/links.github}}
            {{#links.demo}}
            <a class="btn btn-primary btn-sm icon-btn" href="{{links.demo}}" target="_blank" rel="noreferrer">
              <i class="fa-solid fa-arrow-up-right-from-square"></i> Demo
            </a>
            {{/links.demo}}
          </div>
        </div>
      </div>
    </div>
  </script>

  <script id="tpl-experience" type="x-tmpl-mustache">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
          <div>
            <h5 class="card-title mb-1">{{title}}</h5>
            <div class="text-secondary">{{company}}{{#location}} · {{location}}{{/location}}</div>
          </div>
          <div class="text-secondary small">{{start}} — {{end}}</div>
        </div>
        {{#bullets.length}}
        <ul class="mt-3 mb-2">
          {{#bullets}}
          <li>{{.}}</li>
          {{/bullets}}
        </ul>
        {{/bullets.length}}
        {{#stack.length}}
        <div class="stack">
          {{#stack}}
          <span class="badge rounded-pill badge-soft">{{.}}</span>
          {{/stack}}
        </div>
        {{/stack.length}}
      </div>
    </div>
  </script>

  <!-- Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/4.2.0/mustache.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Rendering + behavior -->
  <script>
    (function () {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const savedTheme = localStorage.getItem('theme');
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', theme);
      const themeToggle = document.getElementById('themeToggle');
      const updateThemeIcon = () => {
        themeToggle.innerHTML = document.documentElement.getAttribute('data-bs-theme') === 'dark'
          ? '<i class="fa-solid fa-sun"></i>'
          : '<i class="fa-solid fa-moon"></i>';
      };
      updateThemeIcon();
      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-bs-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon();
      });
    })();

    async function loadContent() {
      try {
        const res = await fetch('content.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('No content.json');
        return await res.json();
      } catch (e) {
        const raw = document.getElementById('default-content').textContent;
        return JSON.parse(raw);
      }
    }

    function el(tag, cls, html) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (html) n.innerHTML = html;
      return n;
    }

    function renderBrand(data) {
      const brandSlot = document.getElementById('brand-slot');
      brandSlot.innerHTML = '';
      if (data.photo) {
        const img = el('img', 'avatar', '');
        img.src = data.photo;
        img.alt = data.name;
        brandSlot.appendChild(img);
      }
      const span = el('span', 'fw-semibold', data.name || 'Portfolio');
      brandSlot.appendChild(span);
    }

    function renderHero(data) {
      document.getElementById('hero-title').textContent = `${data.name || ''} · ${data.role || 'Engineer'}`;
      document.getElementById('hero-subtitle').textContent = data.tagline || '';

      const cta = document.getElementById('hero-cta');
      cta.innerHTML = '';
      if (data.resume_url && data.resume_url !== '#') {
        cta.appendChild(el('a', 'btn btn-primary icon-btn', '<i class="fa-solid fa-file"></i> Resume')).setAttribute('href', data.resume_url);
      }
      if (data.social && data.social.github) {
        const a = el('a', 'btn btn-outline-secondary icon-btn', '<i class="fa-brands fa-github"></i> GitHub');
        a.href = data.social.github; a.target = '_blank'; a.rel = 'noreferrer';
        cta.appendChild(a);
      }
      if (data.social && data.social.linkedin) {
        const a = el('a', 'btn btn-outline-secondary icon-btn', '<i class="fa-brands fa-linkedin"></i> LinkedIn');
        a.href = data.social.linkedin; a.target = '_blank'; a.rel = 'noreferrer';
        cta.appendChild(a);
      }
    }

    function renderAbout(data) {
      document.getElementById('about-text').textContent = data.about || '';
    }

    function renderSkills(data) {
      const box = document.getElementById('skills-list');
      box.innerHTML = '';
      const skills = Array.isArray(data.skills) ? data.skills : [];
      const tplEl = document.getElementById('tpl-skill');
      const canTpl = !!(window.Mustache && tplEl);
      if (canTpl) {
        const tpl = tplEl.innerHTML;
        skills.forEach(s => {
          const html = Mustache.render(tpl, s);
          box.insertAdjacentHTML('beforeend', html);
        });
      } else {
        // Fallback: build badges via DOM
        skills.forEach(s => {
          const span = el('span', 'badge rounded-pill badge-soft me-2 mb-2');
          if (s.icon) {
            const i = el('i', s.icon + ' me-1');
            span.appendChild(i);
          }
          span.appendChild(document.createTextNode(s.name || ''));
          box.appendChild(span);
        });
      }
    }

    function renderProjects(data) {
      const grid = document.getElementById('projects-grid');
      grid.innerHTML = '';
      const projects = Array.isArray(data.projects) ? data.projects : [];
      const tplEl = document.getElementById('tpl-project');
      const canTpl = !!(window.Mustache && tplEl);
      if (canTpl) {
        const tpl = tplEl.innerHTML;
        projects.forEach(p => {
          const html = Mustache.render(tpl, p);
          grid.insertAdjacentHTML('beforeend', html);
        });
      } else {
        // Fallback DOM rendering
        projects.forEach(p => {
          const col = el('div', 'col-md-6 col-lg-4');
          const card = el('div', 'card h-100 shadow-sm');
          if (p.image) {
            const img = el('img', 'card-img-top');
            img.src = p.image; img.alt = p.title || '';
            card.appendChild(img);
          }
          const body = el('div', 'card-body d-flex flex-column');
          body.appendChild(el('h5', 'card-title', (p.title || '')));
          body.appendChild(el('p', 'card-text flex-grow-1', (p.description || '')));
          if (Array.isArray(p.stack) && p.stack.length) {
            const stack = el('div', 'stack mb-3');
            p.stack.forEach(s => stack.appendChild(el('span', 'badge rounded-pill badge-soft me-1', s)));
            body.appendChild(stack);
          }
          const actions = el('div', 'd-flex gap-2');
          if (p.links && p.links.github) {
            const a = el('a', 'btn btn-outline-secondary btn-sm icon-btn', '<i class="fa-brands fa-github"></i> Code');
            a.href = p.links.github; a.target = '_blank'; a.rel = 'noreferrer';
            actions.appendChild(a);
          }
          if (p.links && p.links.demo) {
            const a = el('a', 'btn btn-primary btn-sm icon-btn', '<i class="fa-solid fa-arrow-up-right-from-square"></i> Demo');
            a.href = p.links.demo; a.target = '_blank'; a.rel = 'noreferrer';
            actions.appendChild(a);
          }
          body.appendChild(actions);
          card.appendChild(body);
          col.appendChild(card);
          grid.appendChild(col);
        });
      }
    }

    function renderExperience(data) {
      const list = document.getElementById('experience-list');
      if (!list) return;
      list.innerHTML = '';
      const items = Array.isArray(data.experience) ? data.experience : [];
      const tplEl = document.getElementById('tpl-experience');
      const canTpl = !!(window.Mustache && tplEl);
      if (canTpl) {
        const tpl = tplEl.innerHTML;
        items.forEach(job => {
          const html = Mustache.render(tpl, job);
          list.insertAdjacentHTML('beforeend', html);
        });
      } else {
        // Fallback DOM rendering
        items.forEach(job => {
          const card = el('div', 'card shadow-sm');
          const body = el('div', 'card-body');
          const head = el('div', 'd-flex justify-content-between align-items-start flex-wrap gap-2');
          const left = el('div', '');
          left.appendChild(el('h5', 'card-title mb-1', job.title || ''));
          left.appendChild(el('div', 'text-secondary', `${job.company || ''}${job.location ? ' · ' + job.location : ''}`));
          const right = el('div', 'text-secondary small', `${job.start || ''} — ${job.end || ''}`);
          head.appendChild(left); head.appendChild(right);
          body.appendChild(head);
          if (Array.isArray(job.bullets) && job.bullets.length) {
            const ul = el('ul', 'mt-3 mb-2');
            job.bullets.forEach(b => ul.appendChild(el('li', '', b)));
            body.appendChild(ul);
          }
          if (Array.isArray(job.stack) && job.stack.length) {
            const stack = el('div', 'stack');
            job.stack.forEach(s => stack.appendChild(el('span', 'badge rounded-pill badge-soft me-1', s)));
            body.appendChild(stack);
          }
          card.appendChild(body);
          list.appendChild(card);
        });
      }
    }

    function renderContact(data) {
      const wrap = document.getElementById('contact-links');
      wrap.innerHTML = '';
      if (data.social && data.social.email) {
        const a = el('a', 'btn btn-primary icon-btn', '<i class="fa-solid fa-envelope"></i> Email');
        a.href = data.social.email;
        wrap.appendChild(a);
      }
      if (data.social && data.social.github) {
        const a = el('a', 'btn btn-outline-secondary icon-btn', '<i class="fa-brands fa-github"></i> GitHub');
        a.href = data.social.github; a.target = '_blank'; a.rel = 'noreferrer';
        wrap.appendChild(a);
      }
      if (data.social && data.social.linkedin) {
        const a = el('a', 'btn btn-outline-secondary icon-btn', '<i class="fa-brands fa-linkedin"></i> LinkedIn');
        a.href = data.social.linkedin; a.target = '_blank'; a.rel = 'noreferrer';
        wrap.appendChild(a);
      }
    }

    function renderFooter(data) {
      const year = new Date().getFullYear();
      document.getElementById('copyright').textContent = `© ${year} ${data.name || ''}`;
    }

    (async function init() {
      const data = await loadContent();
      try { renderBrand(data); } catch (e) { console.error('brand', e); }
      try { renderHero(data); } catch (e) { console.error('hero', e); }
      try { renderAbout(data); } catch (e) { console.error('about', e); }
      try { renderSkills(data); } catch (e) { console.error('skills', e); }
      try { renderExperience(data); } catch (e) { console.error('experience', e); }
      try { renderProjects(data); } catch (e) { console.error('projects', e); }
      try { renderContact(data); } catch (e) { console.error('contact', e); }
      try { renderFooter(data); } catch (e) { console.error('footer', e); }
    })();
  </script>

</body>

</html>
